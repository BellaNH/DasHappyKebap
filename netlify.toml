[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/favicon.jpg"
  to = "/favicon.jpg"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
